              fun getShiftEventColor(title: String, startHour: Int): Int {
                  val lowerTitle = title.trim().lowercase(Locale.getDefault())
                  return when {
                      lowerTitle == "loma" || lowerTitle.contains("vuosiloma") -> Color.parseColor("#00ACC1")
