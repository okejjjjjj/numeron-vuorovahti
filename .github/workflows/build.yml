name: Generate Keystore

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Keystore and Base64
        run: |
          keytool -genkeypair -v -keystore release-key.jks -alias vuorovahti -keyalg RSA -keysize 2048 -validity 10000 -storepass Salasana123! -keypass Salasana123! -dname "CN=Vuorovahti, OU=App, O=Oma, L=Outokumpu, S=NK, C=FI"
          base64 -w 0 release-key.jks > keystore_base64.txt

      - name: Upload Keystore Info
        uses: actions/upload-artifact@v4
        with:
          name: TALLENNA-TAMA-AVAIN
          path: |
            release-key.jks
            keystore_base64.txt
