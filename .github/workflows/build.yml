name: Build Android Release & Debug

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release-key.jks

      - name: Build Debug APK & Signed Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleDebug bundleRelease

      - name: Upload Debug APK (Puhelimeen)
        uses: actions/upload-artifact@v4
        with:
          name: numeron-vuorovahti-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Google Play Release AAB (Play Consoleen)
        uses: actions/upload-artifact@v4
        with:
          name: google-play-release-aab
          path: app/build/outputs/bundle/release/*.aab
